<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche habitude</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B1730}a:hover{color:#000}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFF0F4; color: #3B1730; font-family: 'Sour Gummy', system-ui, sans-serif">

  <header style="background: #FFFFFF; border-radius: 0 0 32px 32px; box-shadow: 0 6px 20px rgba(59,23,48,0.06); padding: 52px 20px 16px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="H2-SemaineBonbon.dc.html" aria-label="Retour" style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #FFF0F4; display: flex; align-items: center; justify-content: center; color: #3B1730">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.caretLB}}"/></svg>
      </a>
      <span style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #BFE3FF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 256 256" fill="#3B1730" aria-hidden="true" style="display: block"><path d="{{ic.dropR}}"/></svg>
      </span>
      <div style="flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.1">Boire de l'eau</h1>
        <div style="font-size: 14px; font-weight: 400; color: #7A5670; margin-top: 2px">8 verres · chaque jour</div>
      </div>
      <button aria-label="Modifier l'habitude" style="width: 40px; height: 40px; flex: none; padding: 0; border-radius: 50%; border: 0; background: #FFF0F4; display: flex; align-items: center; justify-content: center; color: #3B1730">
        <svg width="19" height="19" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.pencilR}}"/></svg>
      </button>
    </div>
    <div aria-hidden="true" style="height: 1.5px; border-radius: 1px; background: #F6DCE6; margin: 16px 4px 0"></div>
    <div role="tablist" aria-label="Période" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 14px; background: #FFF4F7; border-radius: 22px; padding: 4px">
      <sc-for list="{{periods}}" as="p" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{p.sel}}" onClick="{{p.pick}}" style="height: 40px; border: 0; border-radius: 18px; background: {{p.bg}}; box-shadow: {{p.sh}}; color: {{p.fg}}; font-size: 16px; font-weight: 500">{{p.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="padding: 16px 20px 0">
    <section style="position: relative; overflow: hidden; height: 180px; border-radius: 32px; background: #FFFFFF; box-shadow: 0 4px 0 #F3D6E0">
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: {{wave}}; background: #BFE3FF; border-radius: 60% 40% 0 0 / 20px 20px 0 0; transition: height 0.35s"></div>
      <div aria-hidden="true" style="position: absolute; left: -10%; right: -10%; bottom: 0; height: {{wave2}}; background: #A5D6FB; opacity: 0.55; border-radius: 40% 60% 0 0 / 24px 16px 0 0; transition: height 0.35s"></div>
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 18px">
        <span style="font-size: 15px; font-weight: 400; color: #6A4A60">Aujourd'hui</span>
        <span style="font-size: 64px; font-weight: 600; line-height: 1">{{n}}<span style="font-size: 30px; color: #6A4A60">/8</span></span>
        <span style="font-size: 16px; font-weight: 500">{{litres}}</span>
      </div>
      <div aria-hidden="true" style="position: absolute; left: 18px; right: 18px; bottom: 16px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{glasses}}" as="g" hint-placeholder-count="8">
          <span style="height: 28px; border-radius: 6px 6px 11px 11px; background: {{g}}; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.9)"></span>
        </sc-for>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 12px; background: #FFFFFF; border-radius: 22px; padding: 12px 4px; box-shadow: 0 3px 0 #F3D6E0">
      <div style="text-align: center">
        <div style="font-size: 22px; font-weight: 600; line-height: 1.1">12</div>
        <div style="font-size: 13px; font-weight: 400; color: #7A5670">jours de suite</div>
      </div>
      <div style="text-align: center; border-left: 1.5px solid #FBEAF0; border-right: 1.5px solid #FBEAF0">
        <div style="font-size: 22px; font-weight: 600; line-height: 1.1">31</div>
        <div style="font-size: 13px; font-weight: 400; color: #7A5670">record</div>
      </div>
      <div style="text-align: center">
        <div style="font-size: 22px; font-weight: 600; line-height: 1.1">89 %</div>
        <div style="font-size: 13px; font-weight: 400; color: #7A5670">ce mois-ci</div>
      </div>
    </div>

    <section style="margin-top: 12px; background: #FFFFFF; border-radius: 28px; padding: 14px 16px; box-shadow: 0 3px 0 #F3D6E0">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 18px; font-weight: 600">Octobre</h2>
        <span style="font-size: 13px; font-weight: 400; color: #7A5670">objectif atteint 12 jours</span>
      </div>

      <sc-if value="{{vCal}}" hint-placeholder-val="{{ true }}">
        <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; margin-top: 10px; text-align: center; font-size: 12px; font-weight: 500; color: #9A7A90">
          <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
        </div>
        <div role="img" aria-label="Calendrier d'octobre, intensité selon le nombre de verres" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; margin-top: 6px; border-radius: 16px; overflow: hidden">
          <sc-for list="{{cal}}" as="c" hint-placeholder-count="35">
            <span style="height: 30px; border-radius: 3px; background: {{c.bg}}; box-shadow: {{c.ring}}; color: {{c.fg}}; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; line-height: 1">{{c.d}}</span>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{vBars}}" hint-placeholder-val="{{ false }}">
        <div role="img" aria-label="Verres bus chaque jour d'octobre" style="position: relative; display: flex; align-items: flex-end; gap: 3px; height: 112px; margin-top: 14px; border-top: 1.5px dashed #F3C9D7; padding-top: 4px">
          <span style="position: absolute; right: 0; top: -9px; padding: 0 0 0 6px; background: #FFFFFF; font-size: 11px; font-weight: 500; color: #9A7A90; line-height: 1">8 verres</span>
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="31">
            <span style="flex: 1; height: {{b.h}}; border-radius: 5px; background: {{b.bg}}; box-shadow: {{b.ring}}"></span>
          </sc-for>
        </div>
        <div aria-hidden="true" style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; font-weight: 500; color: #9A7A90">
          <span>1</span><span>10</span><span>20</span><span>31</span>
        </div>
      </sc-if>

      <sc-if value="{{vDrops}}" hint-placeholder-val="{{ false }}">
        <div role="img" aria-label="Une goutte par jour d'octobre, plus elle est foncée plus tu as bu" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px 4px; margin-top: 12px; justify-items: center">
          <sc-for list="{{drops}}" as="g" hint-placeholder-count="31">
            <span style="position: relative; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center">
              <svg width="30" height="30" viewBox="0 0 256 256" fill="{{g.fill}}" aria-hidden="true" style="display: block"><path d="{{g.d}}"/></svg>
              <span style="position: absolute; bottom: -1px; right: -2px; width: 8px; height: 8px; border-radius: 50%; background: {{g.dot}}"></span>
            </span>
          </sc-for>
        </div>
      </sc-if>
    </section>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; gap: 10px">
    <button aria-label="Retirer un verre" onClick="{{minus}}" style="width: 60px; height: 60px; flex: none; padding: 0; border-radius: 50%; border: 0; background: #FFFFFF; box-shadow: 0 3px 0 #F3D6E0; display: flex; align-items: center; justify-content: center; color: #3B1730">
      <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.minusB}}"/></svg>
    </button>
    <button onClick="{{plus}}" style="flex: 1; height: 60px; border-radius: 30px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 19px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 rgba(59,23,48,0.2)">
      <svg width="18" height="18" viewBox="0 0 256 256" fill="#FFFFFF" aria-hidden="true" style="display: block"><path d="{{ic.plusB}}"/></svg>
      {{cta}}
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F0507F","options":["#F0507F","#FF8A4C","#9B6BFF","#2FB48A"]},"mois":{"editor":"enum","options":["Calendrier","Barres","Gouttes"],"default":"Calendrier"},"$preview":{"width":390,"height":844}}'>
const IC={caretLB:'M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z',
pencilR:'M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z',
dropR:'M174,47.75a254.19,254.19,0,0,0-41.45-38.3,8,8,0,0,0-9.18,0A254.19,254.19,0,0,0,82,47.75C54.51,79.32,40,112.6,40,144a88,88,0,0,0,176,0C216,112.6,201.49,79.32,174,47.75ZM128,216a72.08,72.08,0,0,1-72-72c0-57.23,55.47-105,72-118,16.53,13,72,60.75,72,118A72.08,72.08,0,0,1,128,216Zm55.89-62.66a57.6,57.6,0,0,1-46.56,46.55A8.75,8.75,0,0,1,136,200a8,8,0,0,1-1.32-15.89c16.57-2.79,30.63-16.85,33.44-33.45a8,8,0,0,1,15.78,2.68Z',
minusB:'M228,128a12,12,0,0,1-12,12H40a12,12,0,0,1,0-24H216A12,12,0,0,1,228,128Z',
dropF:'M174,47.75a254.19,254.19,0,0,0-41.45-38.3,8,8,0,0,0-9.18,0A254.19,254.19,0,0,0,82,47.75C54.51,79.32,40,112.6,40,144a88,88,0,0,0,176,0C216,112.6,201.49,79.32,174,47.75Zm9.85,105.59a57.6,57.6,0,0,1-46.56,46.55A8.75,8.75,0,0,1,136,200a8,8,0,0,1-1.32-15.89c16.57-2.79,30.63-16.85,33.44-33.45a8,8,0,0,1,15.78,2.68Z',
plusB:'M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z'};
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 5, period: 0 }; }
  renderVals() {
    const n = this.state.n;
    const accent = this.props.accent ?? '#F0507F';
    const P = ['Jour', 'Semaine', 'Mois'];
    const periods = P.map((label, i) => {
      const sel = i === this.state.period;
      return { label, sel: sel ? 'true' : 'false',
        bg: sel ? '#FFFFFF' : 'transparent',
        sh: sel ? '0 2px 0 #F3D6E0, inset 0 0 0 2px #FFC9DA' : 'none',
        fg: sel ? '#3B1730' : '#7A5670',
        pick: () => this.setState({ period: i }) };
    });
    const glasses = [0,1,2,3,4,5,6,7].map((i) => i < n ? '#6FB8F0' : 'rgba(255,255,255,0.6)');
    const past = [8,8,7,8,3,8,6,8,8,5,8,8,7,8,1,8,8,6,8];
    const val = (d) => d < 20 ? past[d - 1] : (d === 20 ? n : null);
    const shade = (v) => v === 0 ? '#F6ECF0' : v <= 3 ? '#DCEFFF' : v <= 5 ? '#BFE3FF' : v <= 7 ? '#8FCBF7' : '#4F9FE0';
    const cal = [];
    for (let i = 0; i < 3; i++) cal.push({ d: '', bg: '#FBF4F7', ring: 'none', fg: 'transparent' });
    for (let d = 1; d <= 31; d++) {
      const v = val(d);
      if (v === null) cal.push({ d, bg: '#FBF4F7', ring: 'none', fg: '#B9A0AF' });
      else cal.push({ d, bg: shade(v), ring: d === 20 ? 'inset 0 0 0 2.5px #3B1730' : 'none', fg: v === 8 ? '#FFFFFF' : '#3B1730' });
    }
    cal.push({ d: '', bg: '#FBF4F7', ring: 'none', fg: 'transparent' });
    const bars = [];
    for (let d = 1; d <= 31; d++) {
      const v = val(d);
      if (v === null) bars.push({ h: '6px', bg: '#F6ECF0', ring: 'none' });
      else bars.push({ h: Math.max(6, Math.round(v / 8 * 100)) + '%', bg: v >= 8 ? '#4F9FE0' : '#BFE3FF', ring: d === 20 ? '0 0 0 2px #3B1730' : 'none' });
    }
    const drops = [];
    for (let d = 1; d <= 31; d++) {
      const v = val(d);
      if (v === null) drops.push({ d: IC.dropR, fill: '#E8D3DE', dot: 'transparent' });
      else drops.push({ d: IC.dropF, fill: v === 0 ? '#EBDDE4' : shade(v), dot: d === 20 ? accent : 'transparent' });
    }
    const variant = this.props.mois ?? 'Calendrier';
    const pct = n / 8;
    const accent2 = accent;
    return {
      accent: accent2, ic: IC, n, periods, glasses, cal, bars, drops,
      vCal: variant === 'Calendrier', vBars: variant === 'Barres', vDrops: variant === 'Gouttes',
      litres: String(n * 0.25).replace('.', ',') + ' L sur 2 L',
      wave: Math.round(18 + pct * 52) + '%',
      wave2: Math.round(12 + pct * 50) + '%',
      cta: n >= 8 ? 'Objectif atteint !' : '+1 verre',
      plus: () => this.setState({ n: Math.min(8, n + 1) }),
      minus: () => this.setState({ n: Math.max(0, n - 1) })
    };
  }
}
</script>
</body>
</html>
