<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Créer une habitude — jours, moment et rappels</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B1730}a:hover{color:#000}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFF0F4; color: #3B1730; font-family: 'Sour Gummy', system-ui, sans-serif">

  <header style="background: #FFFFFF; border-radius: 0 0 32px 32px; box-shadow: 0 6px 20px rgba(59,23,48,0.06); padding: 52px 20px 16px">
    <div style="display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 10px">
      <a href="P2-Reglages.dc.html" aria-label="Étape précédente" style="width: 40px; height: 40px; border-radius: 50%; background: #FFF0F4; display: flex; align-items: center; justify-content: center; color: #3B1730">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.caretLB}}"/></svg>
      </a>
      <h1 style="margin: 0; text-align: center; font-size: 22px; font-weight: 600; line-height: 1.1">Quand ?</h1>
      <span style="height: 28px; border-radius: 14px; background: #FFF0F4; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: #5E4A58; line-height: 1">3/3</span>
    </div>
    <div aria-hidden="true" style="height: 1.5px; border-radius: 1px; background: #F6DCE6; margin: 16px 4px 0"></div>
    <div role="progressbar" aria-label="Étape 3 sur 3" aria-valuemin="1" aria-valuemax="3" aria-valuenow="3" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; margin-top: 14px; background: #FFF4F7; border-radius: 8px; padding: 3px">
      <span style="height: 8px; border-radius: 5px; background: {{accent}}"></span>
      <span style="height: 8px; border-radius: 5px; background: {{accent}}"></span>
      <span style="height: 8px; border-radius: 5px; background: {{accent}}"></span>
    </div>
  </header>

  <div style="padding: 16px 20px 0">
    <section style="background: #FFFFFF; border-radius: 26px; padding: 14px 16px 16px; box-shadow: 0 3px 0 #F3D6E0">
      <div style="font-size: 15px; font-weight: 500">Rythme</div>
      <div role="radiogroup" aria-label="Rythme" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 10px; background: #FFF4F7; border-radius: 22px; padding: 4px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
          <button role="radio" aria-checked="{{m.sel}}" onClick="{{m.pick}}" style="height: 40px; border: 0; border-radius: 18px; background: {{m.bg}}; box-shadow: {{m.sh}}; color: {{m.fg}}; font-size: 15px; font-weight: 500">{{m.label}}</button>
        </sc-for>
      </div>

      <sc-if value="{{byDays}}" hint-placeholder-val="{{ true }}">
        <div role="group" aria-label="Jours actifs" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; margin-top: 12px; border-radius: 16px; overflow: hidden">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <button aria-pressed="{{d.pressed}}" aria-label="{{d.full}}" onClick="{{d.pick}}" style="height: 58px; padding: 0; border: 0; border-radius: 3px; background: {{d.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{d.fg}}; line-height: 1">
              <span style="font-size: 14px; font-weight: 600">{{d.l}}</span>
              <svg width="14" height="14" viewBox="0 0 256 256" fill="{{d.iconFill}}" aria-hidden="true" style="display: block"><path d="{{d.icon}}"/></svg>
            </button>
          </sc-for>
        </div>
        <p style="margin: 10px 0 0; font-size: 14px; font-weight: 400; color: #5E4A58">{{daysHint}}</p>
      </sc-if>

      <sc-if value="{{byCount}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
          <button aria-label="Moins" onClick="{{cDec}}" style="width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 0; background: #FFF0F4; display: flex; align-items: center; justify-content: center; color: #3B1730">
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.minusB}}"/></svg>
          </button>
          <div style="text-align: center">
            <div style="font-size: 40px; font-weight: 600; line-height: 1">{{count}}</div>
            <div style="font-size: 14px; font-weight: 400; color: #7A5670">fois par semaine</div>
          </div>
          <button aria-label="Plus" onClick="{{cInc}}" style="width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 0; background: #FFF0F4; display: flex; align-items: center; justify-content: center; color: #3B1730">
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.plusB}}"/></svg>
          </button>
        </div>
        <p style="margin: 10px 0 0; font-size: 14px; font-weight: 400; color: #5E4A58">Les jours sans séance ne cassent pas ta série.</p>
      </sc-if>
    </section>

    <section style="margin-top: 12px; background: #FFFFFF; border-radius: 26px; padding: 14px 16px 16px; box-shadow: 0 3px 0 #F3D6E0">
      <div style="font-size: 15px; font-weight: 500">Moment de la journée</div>
      <div role="radiogroup" aria-label="Moment" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 10px; background: #FFF4F7; border-radius: 22px; padding: 4px">
        <sc-for list="{{moments}}" as="m" hint-placeholder-count="4">
          <button role="radio" aria-checked="{{m.sel}}" onClick="{{m.pick}}" style="height: 52px; border: 0; border-radius: 18px; background: {{m.bg}}; box-shadow: {{m.sh}}; color: {{m.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; line-height: 1">
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{m.icon}}"/></svg>
            <span style="font-size: 13px; font-weight: 500">{{m.label}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="margin-top: 12px; background: #FFFFFF; border-radius: 26px; padding: 14px 16px; box-shadow: 0 3px 0 #F3D6E0">
      <div style="font-size: 15px; font-weight: 500">Rappels</div>
      <div style="display: flex; gap: 8px; margin-top: 10px">
        <span style="height: 38px; padding: 0 14px; border-radius: 19px; background: #FFF4F7; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500">
          <svg width="16" height="16" viewBox="0 0 256 256" fill="#3B1730" aria-hidden="true" style="display: block"><path d="{{ic.bellR}}"/></svg>08:00
        </span>
        <span style="height: 38px; padding: 0 14px; border-radius: 19px; background: #FFF4F7; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500">
          <svg width="16" height="16" viewBox="0 0 256 256" fill="#3B1730" aria-hidden="true" style="display: block"><path d="{{ic.bellR}}"/></svg>14:00
        </span>
        <button aria-label="Ajouter un rappel" style="width: 38px; height: 38px; padding: 0; border-radius: 50%; border: 2px dashed #F3C9D7; background: transparent; display: flex; align-items: center; justify-content: center; color: #7A5670">
          <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.plusB}}"/></svg>
        </button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px">
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-size: 15px; font-weight: 500">Si la série est en danger</span>
          <span style="font-size: 13px; font-weight: 400; color: #7A5670">un petit rappel à 21:00</span>
        </span>
        <button role="switch" aria-checked="{{danger}}" aria-label="Rappel si la série est en danger" onClick="{{toggleDanger}}" style="width: 50px; height: 30px; padding: 3px; border-radius: 15px; border: 0; background: {{dTrack}}; display: flex; justify-content: {{dAlign}}; align-items: center">
          <span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(59,23,48,0.25)"></span>
        </button>
      </div>
    </section>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 28px">
    <a href="H2-SemaineBonbon.dc.html" style="height: 60px; border-radius: 30px; background: {{accent}}; color: #FFFFFF; font-size: 19px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-shadow: 0 4px 0 rgba(59,23,48,0.2)">
      <svg width="18" height="18" viewBox="0 0 256 256" fill="#FFFFFF" aria-hidden="true" style="display: block"><path d="{{ic.checkB}}"/></svg>
      Créer l'habitude
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F0507F","options":["#F0507F","#FF8A4C","#9B6BFF","#2FB48A"]},"$preview":{"width":390,"height":844}}'>
const IC={caretLB:'M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z',
minusB:'M228,128a12,12,0,0,1-12,12H40a12,12,0,0,1,0-24H216A12,12,0,0,1,228,128Z',
plusB:'M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z',
checkB:'M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z',
moonR:'M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z',
sunR:'M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z',
sunHR:'M240,152H199.55a73.54,73.54,0,0,0,.45-8,72,72,0,0,0-144,0,73.54,73.54,0,0,0,.45,8H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM72,144a56,56,0,1,1,111.41,8H72.59A56.13,56.13,0,0,1,72,144Zm144,56a8,8,0,0,1-8,8H48a8,8,0,0,1,0-16H208A8,8,0,0,1,216,200ZM72.84,43.58a8,8,0,0,1,14.32-7.16l8,16a8,8,0,0,1-14.32,7.16Zm-56,48.84a8,8,0,0,1,10.74-3.57l16,8a8,8,0,0,1-7.16,14.31l-16-8A8,8,0,0,1,16.84,92.42Zm192,15.16a8,8,0,0,1,3.58-10.73l16-8a8,8,0,1,1,7.160,14.31l-16,8a8,8,0,0,1-10.74-3.58Zm-48-55.16,8-16a8,8,0,0,1,14.32,7.16l-8,16a8,8,0,1,1-14.32-7.16Z',
clockR:'M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z',
bellR:'M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216ZM48,184c7.7-13.24,16-43.92,16-80a64,64,0,1,1,128,0c0,36.05,8.28,66.73,16,80Z'};
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 0, days: [true, true, true, true, true, false, false], count: 3, moment: 3, danger: true }; }
  renderVals() {
    const accent = this.props.accent ?? '#F0507F';
    const s = this.state;
    const seg = (label, i, cur, pick) => {
      const sel = i === cur;
      return { label, sel: sel ? 'true' : 'false',
        bg: sel ? '#FFFFFF' : 'transparent',
        sh: sel ? '0 2px 0 #F3D6E0, inset 0 0 0 2px #FFC9DA' : 'none',
        fg: sel ? '#3B1730' : '#7A5670', pick };
    };
    const modes = ['Jours précis', 'X fois / semaine'].map((l, i) => seg(l, i, s.mode, () => this.setState({ mode: i })));
    const L = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
    const F = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
    const days = L.map((l, i) => {
      const on = s.days[i];
      return { l, full: F[i] + (on ? ', actif' : ', repos'), pressed: on ? 'true' : 'false',
        bg: on ? '#BFE3FF' : '#FBF4F7', fg: on ? '#1E4A6E' : '#B9A0AF',
        icon: on ? IC.checkB : IC.moonR, iconFill: on ? '#1E4A6E' : '#C9A9BC',
        pick: () => { const nd = s.days.slice(); nd[i] = !nd[i]; if (nd.some((x) => x)) this.setState({ days: nd }); } };
    });
    const off = F.filter((f, i) => !s.days[i]).map((f) => f.toLowerCase());
    const nOn = s.days.filter((x) => x).length;
    const daysHint = off.length === 0 ? 'Tous les jours, sans repos.'
      : nOn + ' jours actifs · repos le ' + (off.length === 1 ? off[0] : off.slice(0, -1).join(', ') + ' et ' + off[off.length - 1]) + '. Ces jours-là ne comptent pas dans la série.';
    const M = [{ label: 'Matin', icon: IC.sunHR }, { label: 'Midi', icon: IC.sunR }, { label: 'Soir', icon: IC.moonR }, { label: 'Journée', icon: IC.clockR }];
    const moments = M.map((m, i) => ({ ...seg(m.label, i, s.moment, () => this.setState({ moment: i })), icon: m.icon }));
    return {
      accent, ic: IC, modes, days, daysHint, moments,
      byDays: s.mode === 0, byCount: s.mode === 1, count: s.count,
      cInc: () => this.setState({ count: Math.min(7, s.count + 1) }),
      cDec: () => this.setState({ count: Math.max(1, s.count - 1) }),
      danger: s.danger ? 'true' : 'false',
      dTrack: s.danger ? accent : '#EBDDE4', dAlign: s.danger ? 'flex-end' : 'flex-start',
      toggleDanger: () => this.setState({ danger: !s.danger })
    };
  }
}
</script>
</body>
</html>
