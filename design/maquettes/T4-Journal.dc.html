<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Type journal — Écrire 3 lignes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B1730}a:hover{color:#000}
button,textarea{font:inherit}
button{cursor:pointer}
textarea:focus{outline:2.5px solid #FFC9DA;outline-offset:2px}
textarea::placeholder{color:#B9A0AF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFF0F4; color: #3B1730; font-family: 'Sour Gummy', system-ui, sans-serif">

  <header style="background: #FFFFFF; border-radius: 0 0 32px 32px; box-shadow: 0 6px 20px rgba(59,23,48,0.06); padding: 52px 20px 16px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="H2-SemaineBonbon.dc.html" aria-label="Retour" style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #FFF0F4; display: flex; align-items: center; justify-content: center; color: #3B1730">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.caretLB}}"/></svg>
      </a>
      <span style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #FFCBA4; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 256 256" fill="#3B1730" aria-hidden="true" style="display: block"><path d="{{ic.noteR}}"/></svg>
      </span>
      <div style="flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.1">Écrire 3 lignes</h1>
        <div style="font-size: 14px; font-weight: 400; color: #7A5670; margin-top: 2px">journal · chaque soir</div>
      </div>
      <button aria-label="Modifier l'habitude" style="width: 40px; height: 40px; flex: none; padding: 0; border-radius: 50%; border: 0; background: #FFF0F4; display: flex; align-items: center; justify-content: center; color: #3B1730">
        <svg width="19" height="19" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.pencilR}}"/></svg>
      </button>
    </div>
    <div aria-hidden="true" style="height: 1.5px; border-radius: 1px; background: #F6DCE6; margin: 16px 4px 0"></div>
    <div role="tablist" aria-label="Vue" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; background: #FFF4F7; border-radius: 22px; padding: 4px">
      <sc-for list="{{tabs}}" as="p" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{p.sel}}" onClick="{{p.pick}}" style="height: 40px; border: 0; border-radius: 18px; background: {{p.bg}}; box-shadow: {{p.sh}}; color: {{p.fg}}; font-size: 16px; font-weight: 500">{{p.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="padding: 16px 20px 0">
    <sc-if value="{{showToday}}" hint-placeholder-val="{{ true }}">
      <section style="background: #FFFFFF; border-radius: 30px; padding: 16px; box-shadow: 0 4px 0 #F3D6E0">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
          <label for="jnl" style="font-size: 18px; font-weight: 500; line-height: 1.2">{{prompt}}</label>
          <button onClick="{{nextPrompt}}" style="flex: none; height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: #FFF0F4; color: #5E4A58; font-size: 13px; font-weight: 500">Autre question</button>
        </div>
        <textarea id="jnl" rows="4" value="{{text}}" onInput="{{setText}}" placeholder="Une ligne par idée…" style="display: block; width: 100%; box-sizing: border-box; margin-top: 12px; height: 124px; resize: none; border: 0; border-radius: 18px; background: #FFF8F3; padding: 12px 14px; font-size: 16px; font-weight: 400; line-height: 26px; color: #3B1730"></textarea>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px">
          <div aria-hidden="true" style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; background: #FFF4F7; border-radius: 8px; padding: 3px">
            <sc-for list="{{segs}}" as="g" hint-placeholder-count="3">
              <span style="height: 8px; border-radius: 5px; background: {{g}}"></span>
            </sc-for>
          </div>
          <span style="font-size: 14px; font-weight: 500; color: #5E4A58">{{lines}} / 3 lignes</span>
        </div>
      </section>

      <section style="margin-top: 12px; background: #FFFFFF; border-radius: 26px; padding: 14px 16px; box-shadow: 0 3px 0 #F3D6E0">
        <div style="font-size: 16px; font-weight: 500">Humeur du jour</div>
        <div role="radiogroup" aria-label="Humeur" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 10px; background: #FFF4F7; border-radius: 20px; padding: 4px">
          <sc-for list="{{moods}}" as="m" hint-placeholder-count="4">
            <button role="radio" aria-checked="{{m.sel}}" aria-label="{{m.label}}" onClick="{{m.pick}}" style="height: 48px; padding: 0; border: 0; border-radius: 16px; background: {{m.bg}}; box-shadow: {{m.sh}}; display: flex; align-items: center; justify-content: center">
              <svg width="28" height="28" viewBox="0 0 256 256" fill="{{m.fill}}" aria-hidden="true" style="display: block"><path d="{{m.d}}"/></svg>
            </button>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{showHistory}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{entries}}" as="e" hint-placeholder-count="4">
          <article style="background: #FFFFFF; border-radius: 24px; padding: 14px 16px; box-shadow: 0 3px 0 #F3D6E0">
            <div style="display: flex; align-items: center; gap: 8px">
              <svg width="20" height="20" viewBox="0 0 256 256" fill="#C26A3A" aria-hidden="true" style="display: block"><path d="{{e.mood}}"/></svg>
              <span style="flex: 1; font-size: 15px; font-weight: 500">{{e.date}}</span>
              <span style="font-size: 13px; font-weight: 400; color: #7A5670">{{e.n}} lignes</span>
            </div>
            <p style="margin: 8px 0 0; font-size: 15px; font-weight: 400; line-height: 1.35; color: #5E4A58; white-space: pre-line">{{e.text}}</p>
          </article>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{showToday}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 20px; right: 20px; bottom: 28px">
      <button onClick="{{save}}" style="width: 100%; height: 60px; border-radius: 30px; border: 0; background: {{ctaBg}}; color: {{ctaFg}}; font-size: 19px; font-weight: 500; box-shadow: {{ctaSh}}">{{cta}}</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F0507F","options":["#F0507F","#FF8A4C","#9B6BFF","#2FB48A"]},"$preview":{"width":390,"height":844}}'>
const IC={caretLB:'M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z',
pencilR:'M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z',
noteR:'M229.66,58.34l-32-32a8,8,0,0,0-11.32,0l-96,96A8,8,0,0,0,88,128v32a8,8,0,0,0,8,8h32a8,8,0,0,0,5.66-2.34l96-96A8,8,0,0,0,229.66,58.34ZM124.69,152H104V131.31l64-64L188.69,88ZM200,76.69,179.31,56,192,43.31,212.69,64ZM224,128v80a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V48A16,16,0,0,1,48,32h80a8,8,0,0,1,0,16H48V208H208V128a8,8,0,0,1,16,0Z',
sadR:'M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216ZM80,108a12,12,0,1,1,12,12A12,12,0,0,1,80,108Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,176,108Zm-1.08,64a8,8,0,1,1-13.84,8c-7.47-12.91-19.21-20-33.08-20s-25.61,7.1-33.08,20a8,8,0,1,1-13.84-8c10.29-17.79,27.39-28,46.92-28S164.63,154.2,174.92,172Z',
mehR:'M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-56a8,8,0,0,1-8,8H88a8,8,0,0,1,0-16h80A8,8,0,0,1,176,160ZM80,108a12,12,0,1,1,12,12A12,12,0,0,1,80,108Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,176,108Z',
smileR:'M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216ZM80,108a12,12,0,1,1,12,12A12,12,0,0,1,80,108Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,176,108Zm-1.07,48c-10.29,17.79-27.4,28-46.93,28s-36.63-10.2-46.92-28a8,8,0,1,1,13.84-8c7.47,12.91,19.21,20,33.08,20s25.61-7.1,33.07-20a8,8,0,0,1,13.86,8Z',
winkR:'M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216ZM80,108a12,12,0,1,1,12,12A12,12,0,0,1,80,108Zm104,0a8,8,0,0,1-8,8H152a8,8,0,0,1,0-16h24A8,8,0,0,1,184,108Zm-9.08,48c-10.29,17.79-27.39,28-46.92,28s-36.63-10.2-46.93-28a8,8,0,1,1,13.86-8c7.46,12.91,19.2,20,33.07,20s25.61-7.1,33.08-20a8,8,0,1,1,13.84,8Z'};
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 0, text: 'Un café en terrasse au soleil\nJ’ai fini le chapitre 4', mood: 2, prompt: 0, saved: false }; }
  renderVals() {
    const accent = this.props.accent ?? '#F0507F';
    const s = this.state;
    const tabs = ['Aujourd’hui', 'Historique'].map((label, i) => {
      const sel = i === s.tab;
      return { label, sel: sel ? 'true' : 'false',
        bg: sel ? '#FFFFFF' : 'transparent',
        sh: sel ? '0 2px 0 #F3D6E0, inset 0 0 0 2px #FFC9DA' : 'none',
        fg: sel ? '#3B1730' : '#7A5670',
        pick: () => this.setState({ tab: i }) };
    });
    const PROMPTS = ['Qu’est-ce qui t’a fait sourire aujourd’hui ?', 'Une chose que tu as apprise ?', 'De quoi es-tu fier·e aujourd’hui ?'];
    const lines = Math.min(3, s.text.split('\n').filter((l) => l.trim().length > 0).length);
    const M = [{ d: IC.sadR, label: 'Pas terrible' }, { d: IC.mehR, label: 'Bof' }, { d: IC.smileR, label: 'Bien' }, { d: IC.winkR, label: 'Super' }];
    const moods = M.map((m, i) => {
      const sel = i === s.mood;
      return { d: m.d, label: m.label, sel: sel ? 'true' : 'false',
        bg: sel ? '#FFCBA4' : 'transparent', sh: sel ? '0 2px 0 #F2AE7E' : 'none',
        fill: sel ? '#3B1730' : '#9A7A90',
        pick: () => this.setState({ mood: i }) };
    });
    const complete = lines >= 3;
    const entries = [
      { date: 'Lundi 19 octobre', mood: IC.winkR, n: 3, text: 'Footing sous le soleil\nAppel avec maman\nTerminé la maquette de l’appli' },
      { date: 'Dimanche 18 octobre', mood: IC.smileR, n: 3, text: 'Brunch\nRangé mon bureau\nFilm du soir' },
      { date: 'Samedi 17 octobre', mood: IC.mehR, n: 3, text: 'Journée fatigante\nMais bon repas\nCouché tôt' }
    ];
    return {
      ic: IC, tabs, entries, moods, lines,
      showToday: s.tab === 0, showHistory: s.tab === 1,
      prompt: PROMPTS[s.prompt],
      text: s.text,
      setText: (e) => this.setState({ text: e.target.value, saved: false }),
      nextPrompt: () => this.setState({ prompt: (s.prompt + 1) % PROMPTS.length }),
      segs: [0, 1, 2].map((i) => i < lines ? '#F2A06A' : 'transparent'),
      cta: s.saved ? 'Enregistré !' : (complete ? 'Enregistrer' : 'Encore ' + (3 - lines) + ' ligne' + (3 - lines > 1 ? 's' : '')),
      ctaBg: complete ? accent : '#FFFFFF',
      ctaFg: complete ? '#FFFFFF' : '#9A7A90',
      ctaSh: complete ? '0 4px 0 rgba(59,23,48,0.2)' : '0 3px 0 #F3D6E0',
      save: () => { if (complete) this.setState({ saved: true }); }
    };
  }
}
</script>
</body>
</html>
