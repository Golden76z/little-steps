<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Type durée — Méditer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B1730}a:hover{color:#000}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFF0F4; color: #3B1730; font-family: 'Sour Gummy', system-ui, sans-serif">

  <header style="background: #FFFFFF; border-radius: 0 0 32px 32px; box-shadow: 0 6px 20px rgba(59,23,48,0.06); padding: 52px 20px 16px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="H2-SemaineBonbon.dc.html" aria-label="Retour" style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #FFF0F4; display: flex; align-items: center; justify-content: center; color: #3B1730">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.caretLB}}"/></svg>
      </a>
      <span style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #DCC8FF; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 256 256" fill="#3B1730" aria-hidden="true" style="display: block"><path d="{{ic.lotusR}}"/></svg>
      </span>
      <div style="flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.1">Méditer</h1>
        <div style="font-size: 14px; font-weight: 400; color: #7A5670; margin-top: 2px">{{goalMin}} min · chaque matin</div>
      </div>
      <button aria-label="Modifier l'habitude" style="width: 40px; height: 40px; flex: none; padding: 0; border-radius: 50%; border: 0; background: #FFF0F4; display: flex; align-items: center; justify-content: center; color: #3B1730">
        <svg width="19" height="19" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.pencilR}}"/></svg>
      </button>
    </div>
    <div aria-hidden="true" style="height: 1.5px; border-radius: 1px; background: #F6DCE6; margin: 16px 4px 0"></div>
    <div role="radiogroup" aria-label="Durée de la séance" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 14px; background: #FFF4F7; border-radius: 22px; padding: 4px">
      <sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
        <button role="radio" aria-checked="{{p.sel}}" onClick="{{p.pick}}" style="height: 40px; border: 0; border-radius: 18px; background: {{p.bg}}; box-shadow: {{p.sh}}; color: {{p.fg}}; font-size: 16px; font-weight: 500">{{p.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="padding: 16px 20px 0">
    <section style="background: #FFFFFF; border-radius: 32px; padding: 18px 18px 20px; box-shadow: 0 4px 0 #F3D6E0; display: flex; flex-direction: column; align-items: center">
      <div style="position: relative; width: 210px; height: 210px">
        <svg width="210" height="210" viewBox="0 0 210 210" role="img" aria-label="{{ringLabel}}" style="display: block">
          <circle cx="105" cy="105" r="92" fill="#F4EEFF"/>
          <circle cx="105" cy="105" r="92" fill="none" stroke="#E6DAFF" stroke-width="16"/>
          <circle cx="105" cy="105" r="92" fill="none" stroke="#B79BFF" stroke-width="16" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 105 105)" style="transition: stroke-dasharray 0.9s linear"/>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-size: 48px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums">{{clock}}</span>
          <span style="font-size: 15px; font-weight: 400; color: #7A5670; margin-top: 4px">{{status}}</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 22px; margin-top: 18px">
        <button aria-label="Recommencer" onClick="{{reset}}" style="width: 52px; height: 52px; padding: 0; border-radius: 50%; border: 0; background: #FFF0F4; display: flex; align-items: center; justify-content: center; color: #3B1730">
          <svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.resetB}}"/></svg>
        </button>
        <button aria-label="{{playLabel}}" onClick="{{toggle}}" style="width: 76px; height: 76px; padding: 0; border-radius: 50%; border: 0; background: {{accent}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 rgba(59,23,48,0.2)">
          <svg width="30" height="30" viewBox="0 0 256 256" fill="#FFFFFF" aria-hidden="true" style="display: block; margin-left: {{playNudge}}"><path d="{{playIcon}}"/></svg>
        </button>
        <button aria-label="Terminer la séance" onClick="{{finish}}" style="width: 52px; height: 52px; padding: 0; border-radius: 50%; border: 0; background: #FFF0F4; display: flex; align-items: center; justify-content: center; color: #3B1730">
          <svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.checkB}}"/></svg>
        </button>
      </div>
    </section>

    <button onClick="{{finish}}" style="width: 100%; margin-top: 12px; height: 50px; border-radius: 25px; border: 0; background: #FFFFFF; box-shadow: 0 3px 0 #F3D6E0; color: #3B1730; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 256 256" fill="#3B1730" aria-hidden="true" style="display: block"><path d="{{ic.clockR}}"/></svg>
      J'ai déjà médité, noter {{goalMin}} min
    </button>

    <section style="margin-top: 12px; background: #FFFFFF; border-radius: 26px; padding: 14px 16px; box-shadow: 0 3px 0 #F3D6E0">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 17px; font-weight: 600">Cette semaine</h2>
        <span style="font-size: 13px; font-weight: 400; color: #7A5670">{{weekTotal}} min au total</span>
      </div>
      <div role="img" aria-label="Minutes de méditation par jour cette semaine" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; margin-top: 10px; border-radius: 14px; overflow: hidden">
        <sc-for list="{{week}}" as="w" hint-placeholder-count="7">
          <span style="height: 44px; border-radius: 3px; background: {{w.bg}}; box-shadow: {{w.ring}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1">
            <span style="font-size: 11px; font-weight: 500; color: {{w.lc}}">{{w.l}}</span>
            <span style="font-size: 14px; font-weight: 600; color: {{w.fg}}">{{w.m}}</span>
          </span>
        </sc-for>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F0507F","options":["#F0507F","#FF8A4C","#9B6BFF","#2FB48A"]},"$preview":{"width":390,"height":844}}'>
const IC={caretLB:'M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z',
pencilR:'M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z',
lotusR:'M245.83,121.63a15.53,15.53,0,0,0-9.52-7.33,73.51,73.51,0,0,0-22.17-2.22c4-19.85,1-35.55-2.06-44.86a16.15,16.15,0,0,0-18.79-10.88,85.53,85.53,0,0,0-28.55,12.12,94.58,94.58,0,0,0-27.11-33.25,16.05,16.05,0,0,0-19.26,0A94.48,94.48,0,0,0,91.26,68.46,85.53,85.53,0,0,0,62.71,56.34,16.15,16.15,0,0,0,43.92,67.22c-3,9.31-6,25-2.06,44.86a73.51,73.51,0,0,0-22.17,2.22,15.53,15.53,0,0,0-9.52,7.33,16,16,0,0,0-1.6,12.27c3.39,12.57,13.8,36.48,45.33,55.32S113.13,208,128.05,208s42.67,0,74-18.78c31.53-18.84,41.94-42.75,45.33-55.32A16,16,0,0,0,245.83,121.63ZM59.14,72.14a.2.2,0,0,1,.23-.15A70.43,70.43,0,0,1,85.18,83.66,118.65,118.65,0,0,0,80,119.17c0,18.74,3.77,34,9.11,46.28A123.59,123.59,0,0,1,69.57,140C51.55,108.62,55.3,84,59.14,72.14Zm3,103.35C35.47,159.57,26.82,140.05,24,129.7a59.82,59.82,0,0,1,22.5-1.17,129.08,129.08,0,0,0,9.15,19.41,142.28,142.28,0,0,0,34,39.56A114.92,114.92,0,0,1,62.1,175.49ZM128,190.4c-9.33-6.94-32-28.23-32-71.23C96,76.7,118.38,55.24,128,48c9.62,7.26,32,28.72,32,71.19C160,162.17,137.33,183.46,128,190.4ZM170.82,83.66A70.43,70.43,0,0,1,196.63,72a.2.2,0,0,1,.23.15C200.7,84,204.45,108.62,186.43,140a123.32,123.32,0,0,1-19.54,25.48c5.34-12.26,9.11-27.54,9.11-46.28A118.65,118.65,0,0,0,170.82,83.66ZM232,129.72c-2.77,10.25-11.4,29.81-38.09,45.77a114.92,114.92,0,0,1-27.55,12,142.28,142.28,0,0,0,34-39.56,129.08,129.08,0,0,0,9.15-19.41A59.69,59.69,0,0,1,232,129.71Z',
playF:'M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z',

checkB:'M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z',
clockR:'M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z'};
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { goal: 1, elapsed: 228, running: false, done: false }; }
  componentDidMount() {
    this.iv = setInterval(() => {
      const s = this.state;
      if (!s.running) return;
      const total = [5, 10, 15, 20][s.goal] * 60;
      if (s.elapsed + 1 >= total) this.setState({ elapsed: total, running: false, done: true });
      else this.setState({ elapsed: s.elapsed + 1 });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const accent = this.props.accent ?? '#F0507F';
    const s = this.state;
    const MIN = [5, 10, 15, 20];
    const total = MIN[s.goal] * 60;
    const left = Math.max(0, total - s.elapsed);
    const mm = String(Math.floor(left / 60)).padStart(2, '0');
    const ss = String(left % 60).padStart(2, '0');
    const C = 2 * Math.PI * 92;
    const presets = MIN.map((m, i) => {
      const sel = i === s.goal;
      return { label: m + ' min', sel: sel ? 'true' : 'false',
        bg: sel ? '#FFFFFF' : 'transparent',
        sh: sel ? '0 2px 0 #F3D6E0, inset 0 0 0 2px #FFC9DA' : 'none',
        fg: sel ? '#3B1730' : '#7A5670',
        pick: () => this.setState({ goal: i, elapsed: Math.min(s.elapsed, MIN[i] * 60 - 1), done: false }) };
    });
    const todayMin = Math.floor(s.elapsed / 60);
    const L = ['L','M','M','J','V','S','D'];
    const shade = (m) => m === 0 ? '#F6ECF0' : m < 5 ? '#EEE6FF' : m < 10 ? '#DCC8FF' : m < 15 ? '#C2A8FF' : '#A585F5';
    const week = L.map((l, i) => {
      if (i === 0) return { l, m: 10, bg: shade(10), ring: 'none', lc: '#5E4A58', fg: '#3B1730' };
      if (i === 1) return { l, m: s.done ? MIN[s.goal] : todayMin, bg: shade(s.done ? MIN[s.goal] : todayMin), ring: 'inset 0 0 0 2.5px #3B1730', lc: '#3B1730', fg: '#3B1730' };
      return { l, m: '', bg: '#FBF4F7', ring: 'none', lc: '#B9A0AF', fg: '#B9A0AF' };
    });
    const weekTotal = 10 + (s.done ? MIN[s.goal] : todayMin);
    return {
      accent, ic: IC, presets, week, weekTotal,
      goalMin: MIN[s.goal],
      clock: mm + ':' + ss,
      status: s.done ? 'Séance terminée !' : (s.running ? 'Respire…' : 'sur ' + MIN[s.goal] + ':00'),
      ringLabel: Math.floor(s.elapsed / 60) + ' minutes sur ' + MIN[s.goal],
      dash: (C * Math.min(1, s.elapsed / total)).toFixed(1) + ' ' + C.toFixed(1),
      playIcon: s.running ? IC.pauseF : IC.playF,
      playNudge: s.running ? '0px' : '4px',
      playLabel: s.running ? 'Mettre en pause' : 'Démarrer',
      toggle: () => this.setState({ running: !s.running && !s.done }),
      reset: () => this.setState({ elapsed: 0, running: false, done: false }),
      finish: () => this.setState({ elapsed: total, running: false, done: true })
    };
  }
}
</script>
