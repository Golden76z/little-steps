<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Type quantité — Boire de l'eau</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B1730}a:hover{color:#000}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFF0F4; color: #3B1730; font-family: 'Sour Gummy', system-ui, sans-serif">

  <header style="background: #FFFFFF; border-radius: 0 0 32px 32px; box-shadow: 0 6px 20px rgba(59,23,48,0.06); padding: 52px 20px 16px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="H2-SemaineBonbon.dc.html" aria-label="Retour" style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #FFF0F4; display: flex; align-items: center; justify-content: center; color: #3B1730">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.caretLB}}"/></svg>
      </a>
      <span style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #BFE3FF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 256 256" fill="#3B1730" aria-hidden="true" style="display: block"><path d="{{ic.dropR}}"/></svg>
      </span>
      <div style="flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.1">Boire de l'eau</h1>
        <div style="font-size: 14px; font-weight: 400; color: #7A5670; margin-top: 2px">{{goalLabel}} · chaque jour</div>
      </div>
      <button aria-label="Modifier l'habitude" style="width: 40px; height: 40px; flex: none; padding: 0; border-radius: 50%; border: 0; background: #FFF0F4; display: flex; align-items: center; justify-content: center; color: #3B1730">
        <svg width="19" height="19" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.pencilR}}"/></svg>
      </button>
    </div>
    <div aria-hidden="true" style="height: 1.5px; border-radius: 1px; background: #F6DCE6; margin: 16px 4px 0"></div>
    <div role="radiogroup" aria-label="Unité affichée" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; background: #FFF4F7; border-radius: 22px; padding: 4px">
      <sc-for list="{{units}}" as="u" hint-placeholder-count="2">
        <button role="radio" aria-checked="{{u.sel}}" onClick="{{u.pick}}" style="height: 40px; border: 0; border-radius: 18px; background: {{u.bg}}; box-shadow: {{u.sh}}; color: {{u.fg}}; font-size: 16px; font-weight: 500">{{u.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="padding: 16px 20px 0">
    <section style="position: relative; overflow: hidden; height: 168px; border-radius: 32px; background: #FFFFFF; box-shadow: 0 4px 0 #F3D6E0">
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: {{wave}}; background: #BFE3FF; border-radius: 60% 40% 0 0 / 20px 20px 0 0; transition: height 0.35s"></div>
      <div aria-hidden="true" style="position: absolute; left: -10%; right: -10%; bottom: 0; height: {{wave2}}; background: #A5D6FB; opacity: 0.55; border-radius: 40% 60% 0 0 / 24px 16px 0 0; transition: height 0.35s"></div>
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 22px">
        <span style="font-size: 15px; font-weight: 400; color: #6A4A60">Aujourd'hui</span>
        <span style="font-size: 60px; font-weight: 600; line-height: 1">{{big}}<span style="font-size: 26px; color: #6A4A60">{{bigUnit}}</span></span>
        <span style="font-size: 16px; font-weight: 500">{{sub}}</span>
      </div>
    </section>

    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding: 0 4px">
      <span style="font-size: 15px; font-weight: 500">Ajouter par</span>
      <span style="font-size: 13px; font-weight: 400; color: #7A5670">réglable dans l'habitude</span>
    </div>
    <div role="radiogroup" aria-label="Quantité ajoutée" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 8px; background: #FFFFFF; border-radius: 22px; padding: 4px; box-shadow: 0 3px 0 #F3D6E0">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{s.sel}}" onClick="{{s.pick}}" style="height: 40px; border: 0; border-radius: 18px; background: {{s.bg}}; color: {{s.fg}}; font-size: 16px; font-weight: 500">{{s.label}}</button>
      </sc-for>
    </div>

    <section style="margin-top: 12px; background: #FFFFFF; border-radius: 28px; padding: 14px 16px; box-shadow: 0 3px 0 #F3D6E0">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 18px; font-weight: 600">Octobre</h2>
        <span style="font-size: 13px; font-weight: 400; color: #7A5670">{{calHint}}</span>
      </div>
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; margin-top: 10px; text-align: center; font-size: 12px; font-weight: 500; color: #9A7A90">
        <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
      </div>
      <div role="img" aria-label="Quantité bue chaque jour d'octobre" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; margin-top: 6px; border-radius: 16px; overflow: hidden">
        <sc-for list="{{cal}}" as="c" hint-placeholder-count="35">
          <span style="height: 30px; border-radius: 3px; background: {{c.bg}}; box-shadow: {{c.ring}}; color: {{c.fg}}; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; line-height: 1">{{c.t}}</span>
        </sc-for>
      </div>
    </section>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; gap: 10px">
    <button aria-label="Retirer" onClick="{{minus}}" style="width: 60px; height: 60px; flex: none; padding: 0; border-radius: 50%; border: 0; background: #FFFFFF; box-shadow: 0 3px 0 #F3D6E0; display: flex; align-items: center; justify-content: center; color: #3B1730">
      <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block"><path d="{{ic.minusB}}"/></svg>
    </button>
    <button onClick="{{plus}}" style="flex: 1; height: 60px; border-radius: 30px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 19px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 rgba(59,23,48,0.2)">
      <svg width="18" height="18" viewBox="0 0 256 256" fill="#FFFFFF" aria-hidden="true" style="display: block"><path d="{{ic.plusB}}"/></svg>
      {{cta}}
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F0507F","options":["#F0507F","#FF8A4C","#9B6BFF","#2FB48A"]},"$preview":{"width":390,"height":844}}'>
const IC={caretLB:'M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z',
pencilR:'M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z',
dropR:'M174,47.75a254.19,254.19,0,0,0-41.45-38.3,8,8,0,0,0-9.18,0A254.19,254.19,0,0,0,82,47.75C54.51,79.32,40,112.6,40,144a88,88,0,0,0,176,0C216,112.6,201.49,79.32,174,47.75ZM128,216a72.08,72.08,0,0,1-72-72c0-57.23,55.47-105,72-118,16.53,13,72,60.75,72,118A72.08,72.08,0,0,1,128,216Zm55.89-62.66a57.6,57.6,0,0,1-46.56,46.55A8.75,8.75,0,0,1,136,200a8,8,0,0,1-1.32-15.89c16.57-2.79,30.63-16.85,33.44-33.45a8,8,0,0,1,15.78,2.68Z',
minusB:'M228,128a12,12,0,0,1-12,12H40a12,12,0,0,1,0-24H216A12,12,0,0,1,228,128Z',
plusB:'M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z'};
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ml: 1250, unit: 1, step: 0 }; }
  renderVals() {
    const accent = this.props.accent ?? '#F0507F';
    const GOAL = 2000, GLASS = 250;
    const s = this.state;
    const litres = s.unit === 1;
    const fmtL = (ml) => String(Math.round(ml / 10) / 100).replace('.', ',');
    const units = ['Verres', 'Litres'].map((label, i) => {
      const sel = i === s.unit;
      return { label, sel: sel ? 'true' : 'false',
        bg: sel ? '#FFFFFF' : 'transparent',
        sh: sel ? '0 2px 0 #F3D6E0, inset 0 0 0 2px #FFC9DA' : 'none',
        fg: sel ? '#3B1730' : '#7A5670',
        pick: () => this.setState({ unit: i, step: 0 }) };
    });
    const STEPS = litres
      ? [{ label: '+25 cl', ml: 250 }, { label: '+33 cl', ml: 330 }, { label: '+50 cl', ml: 500 }]
      : [{ label: '+1 verre', ml: 250 }, { label: '+2 verres', ml: 500 }, { label: 'Bouteille', ml: 750 }];
    const steps = STEPS.map((st, i) => {
      const sel = i === s.step;
      return { label: st.label, sel: sel ? 'true' : 'false',
        bg: sel ? '#BFE3FF' : 'transparent', fg: sel ? '#1E4A6E' : '#7A5670',
        pick: () => this.setState({ step: i }) };
    });
    const cur = STEPS[s.step];
    const past = [2000,2000,1750,2100,750,2000,1500,2250,2000,1250,2000,2000,1750,2000,250,2000,2100,1500,2000];
    const val = (d) => d < 20 ? past[d - 1] : (d === 20 ? s.ml : null);
    const shade = (v) => v === 0 ? '#F6ECF0' : v < 1000 ? '#DCEFFF' : v < 1500 ? '#BFE3FF' : v < 2000 ? '#8FCBF7' : '#4F9FE0';
    const cal = [];
    for (let i = 0; i < 3; i++) cal.push({ t: '', bg: '#FBF4F7', ring: 'none', fg: 'transparent' });
    for (let d = 1; d <= 31; d++) {
      const v = val(d);
      if (v === null) cal.push({ t: d, bg: '#FBF4F7', ring: 'none', fg: '#B9A0AF' });
      else cal.push({ t: litres ? fmtL(v) : Math.round(v / GLASS),
        bg: shade(v), ring: d === 20 ? 'inset 0 0 0 2.5px #3B1730' : 'none', fg: v >= GOAL ? '#FFFFFF' : '#3B1730' });
    }
    cal.push({ t: '', bg: '#FBF4F7', ring: 'none', fg: 'transparent' });
    const pct = Math.min(1, s.ml / GOAL);
    return {
      accent, ic: IC, units, steps, cal,
      goalLabel: litres ? '2 L' : '8 verres',
      big: litres ? fmtL(s.ml) : Math.round(s.ml / GLASS),
      bigUnit: litres ? ' / 2 L' : ' / 8',
      sub: litres ? Math.round(s.ml / GLASS) + ' verres de 25 cl' : fmtL(s.ml) + ' L sur 2 L',
      calHint: litres ? 'en litres par jour' : 'en verres par jour',
      wave: Math.round(16 + pct * 52) + '%', wave2: Math.round(10 + pct * 50) + '%',
      cta: s.ml >= GOAL ? 'Objectif atteint !' : cur.label,
      plus: () => this.setState({ ml: Math.min(4000, s.ml + cur.ml) }),
      minus: () => this.setState({ ml: Math.max(0, s.ml - cur.ml) })
    };
  }
}
</script>
</body>
</html>
