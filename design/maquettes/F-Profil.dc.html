      line: i < R.length - 1 ? '1.5px solid #FBEAF0' : 'none' }));
    const T = [
      { label: 'Aujourd’hui', r: IC.houseR, f: IC.houseF, href: 'H2-SemaineBonbon.dc.html' },
      { label: 'Progrès', r: IC.chartR, f: IC.chartF, href: 'F-Progres.dc.html' },
      { label: 'Trophées', r: IC.trophyR, f: IC.trophyF, href: 'F-Trophees.dc.html' },
      { label: 'Profil', r: IC.userR, f: IC.userF, href: 'F-Profil.dc.html' }
    ];
    const tabs = T.map((t, i) => {
      const on = i === 3;
      return { label: t.label, href: t.href, d: on ? t.f : t.r,
        current: on ? 'page' : 'false',
        bg: on ? '#EF6F9C' : 'transparent',
        sh: on ? '0 3px 0 #D9527F' : 'none',
        fg: on ? '#FFFFFF' : '#5E4A58' };
    });
    return { accent, ic: IC, rows, tabsL: tabs.slice(0, 2), tabsR: tabs.slice(2) };
  }
}
</script>
</body>
