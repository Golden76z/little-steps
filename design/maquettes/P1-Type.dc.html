    const s = this.state;
    const T = [

    ];
    const types = T.map((t, i) => {
      const sel = i === s.type;
      return { ...t, sel: sel ? 'true' : 'false',

    });
    const C = [
      { label: 'Boire de l’eau', icon: IC.dropR, bg: '#BFE3FF', type: 0, hint: '2 L' },

      { label: 'Gratitude', icon: IC.noteR, bg: '#FFCBA4', type: 3, hint: '3 lignes' }
    ];
    const pop = C.map((c, i) => {
      const sel = i === s.chip;
      return { ...c, tname: T[c.type].name, sel: sel ? 'true' : 'false',

        cardSh: sel ? '0 3px 0 #F3D6E0, inset 0 0 0 2.5px #FFC9DA' : '0 3px 0 #F3D6E0',

      accent, ic: IC, types, pop,
      vTiles: variant === 'Tuiles', vCarousel: variant === 'Carrousel', vBento: variant === 'Bento',
