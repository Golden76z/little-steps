        sh: sel ? '0 2px 0 #F3D6E0, inset 0 0 0 2px #FFC9DA' : 'none',
        lc: sel ? '#3B1730' : '#7A5670',
        dot: i <= 1 ? accent : 'transparent',
        pick: () => this.setState({ day: i }) };
    });
    const T = [
      { label: 'Aujourd’hui', r: IC.houseR, f: IC.houseF },
      { label: 'Progrès', r: IC.chartR, f: IC.chartF },
      { label: 'Trophées', r: IC.trophyR, f: IC.trophyF },
      { label: 'Profil', r: IC.userR, f: IC.userF }
    ];
    const nav = this.props.nav ?? '#FFFFFF';
    const whiteNav = nav.toUpperCase() === '#FFFFFF';
    const tabs = T.map((t, i) => {
      const on = i === this.state.tab;
      return { label: t.label, d: on ? t.f : t.r,
        href: ['H2-SemaineBonbon.dc.html', 'F-Progres.dc.html', 'F-Trophees.dc.html', 'F-Profil.dc.html'][i],
        current: on ? 'page' : 'false',
        bg: on ? '#EF6F9C' : 'transparent',
        sh: on ? '0 3px 0 #D9527F' : 'none',
        fg: on ? '#FFFFFF' : '#5E4A58',
        pick: () => this.setState({ tab: i }) };
    });
    return { accent, nav, habits, week, tabsL: tabs.slice(0, 2), tabsR: tabs.slice(2), ic: IC };
  }
}
