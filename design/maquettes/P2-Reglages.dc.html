      color: C[s.color].bg, iconD: I[s.icon].d,
      name: s.name, nameShown: s.name.trim() ? s.name : 'Nom de l’habitude',
      setName: (e) => this.setState({ name: e.target.value }),
      nextIcon: () => this.setState({ icon: (s.icon + 1) % I.length }),
      inc: () => this.setState({ goalMl: Math.min(5000, s.goalMl + 250) }),
      dec: () => this.setState({ goalMl: Math.max(250, s.goalMl - 250) })
    };
  }
}
</script>
</body>
