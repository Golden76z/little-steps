<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFF0F4; color: #3B1730; font-family: 'Sour Gummy', system-ui, sans-serif">

  <header style="background: #FFFFFF; border-radius: 0 0 32px 32px; box-shadow: 0 6px 20px rgba(59,23,48,0.06); padding: 52px 20px 16px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span role="img" aria-label="Niveau 7, 68 % vers le niveau 8" style="position: relative; width: 48px; height: 48px; flex: none; display: block">
        <svg width="48" height="48" viewBox="0 0 60 60" aria-hidden="true" style="position: absolute; inset: 0">
          <circle cx="30" cy="30" r="27" fill="none" stroke="#F9E3EB" stroke-width="5"/>
          <circle cx="30" cy="30" r="27" fill="none" stroke="{{accent}}" stroke-width="5" stroke-linecap="round" stroke-dasharray="115.4 169.6" transform="rotate(-90 30 30)"/>
        </svg>
        <span style="position: absolute; inset: 7px; border-radius: 50%; background: #FFF09A; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">7</span>
      </span>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 14px; font-weight: 400; color: #7A5670">340 / 500 XP</div>
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; line-height: 1.1">Trophées</h1>
      </div>
      <span aria-label="Série de 12 jours" style="height: 40px; flex: none; align-self: center; box-sizing: border-box; padding: 0 12px; border-radius: 20px; background: #FFE6D6; display: inline-flex; align-items: center; gap: 5px; font-size: 17px; font-weight: 600; line-height: 1">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="#FF7A3D" aria-hidden="true" style="display: block; flex: none"><path d="{{ic.fireF}}"/></svg>
        12
      </span>
    </div>
    <div aria-hidden="true" style="height: 1.5px; border-radius: 1px; background: #F6DCE6; margin: 16px 4px 0"></div>
    <div role="tablist" aria-label="Catégorie" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; background: #FFF4F7; border-radius: 22px; padding: 4px">
      <sc-for list="{{segs}}" as="p" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{p.sel}}" onClick="{{p.pick}}" style="height: 40px; border: 0; border-radius: 18px; background: {{p.bg}}; box-shadow: {{p.sh}}; color: {{p.fg}}; font-size: 16px; font-weight: 500">{{p.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="padding: 16px 20px 0">
    <sc-if value="{{showBadges}}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="background: #FFFFFF; border-radius: 22px; padding: 12px 14px; box-shadow: 0 3px 0 #F3D6E0; display: flex; align-items: center; gap: 10px">
          <span style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #FFF09A; display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 256 256" fill="#3B1730" aria-hidden="true" style="display: block"><path d="{{ic.shieldR}}"/></svg>
          </span>

          </span>

            </span>
            <span style="font-size: 13px; font-weight: 500; text-align: center; color: {{b.fg}}">{{b.name}}</span>
          </div>
        </sc-for>
      </div>

      <section style="margin-top: 12px; background: #B6F0D2; border-radius: 24px; padding: 14px 16px; box-shadow: 0 3px 0 #93DDB6">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #1F4D35">

          <sc-for list="{{challengeSegs}}" as="s" hint-placeholder-count="7">
            <span style="height: 8px; border-radius: 5px; background: {{s}}"></span>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{showChallenges}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{challenges}}" as="c" hint-placeholder-count="4">
          <div style="background: #FFFFFF; border-radius: 24px; padding: 14px; box-shadow: 0 3px 0 #F3D6E0; display: flex; gap: 12px; align-items: center">
            <span style="width: 46px; height: 46px; flex: none; border-radius: 50%; background: {{c.bg}}; display: flex; align-items: center; justify-content: center">

            </span>

              <span style="display: flex; justify-content: space-between; gap: 8px">
                <span style="font-size: 16px; font-weight: 500">{{c.name}}</span>
                <span style="font-size: 13px; font-weight: 600; color: #7A5670; white-space: nowrap">+{{c.xp}} XP</span>
              </span>
              <span aria-hidden="true" style="display: block; height: 10px; border-radius: 6px; background: #F9E3EB; overflow: hidden"><span style="display: block; height: 10px; border-radius: 6px; width: {{c.w}}; background: {{c.bar}}"></span></span>

            </span>
